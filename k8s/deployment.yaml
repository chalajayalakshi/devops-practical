apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-practical
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-practical
  template:
    metadata:
      labels:
        app: devops-practical
    spec:
      containers:
        - name: web
          image: YOUR_DOCKERHUB_USERNAME/devops-practical:v1
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
